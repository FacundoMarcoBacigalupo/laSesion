services:
  - type: web
    name: la-sesion
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_ENABLED
        value: "true"
      - key: AI_HEARTBEAT_MS
        value: "9000"
      - key: AI_MIN_GAP_MS
        value: "2500"
      - key: AI_MAX_RPM
        value: "6"
      - key: AI_MAX_CALLS
        value: "15"
      - key: AI_MAX_CALLS_DAY
        value: "40"
      - key: AI_TIMEOUT_MS
        value: "7000"
      - key: DATABASE_URL
        sync: false
      - key: RETENTION_HOURS
        value: "24"
      - key: LOG_LEVEL
        value: info
